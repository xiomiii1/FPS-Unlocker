name: Build FPS Unlocker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Find source file
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          SOURCE=$(find . -type f -name "fps_unlocker.cpp" | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: fps_unlocker.cpp was not found!"
            exit 1
          fi

          echo "Found source: $SOURCE"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Create CMakeLists.txt
        run: |
          SOURCE_PATH="${SOURCE#./}"

          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)

          project(FPSUnlocker)

          add_library(FPSUnlocker SHARED
              "$SOURCE_PATH"
          )

          target_compile_features(FPSUnlocker PRIVATE cxx_std_17)

          target_compile_options(FPSUnlocker PRIVATE
              -O2
              -fvisibility=hidden
              -ffunction-sections
              -fdata-sections
          )

          target_link_options(FPSUnlocker PRIVATE
              -Wl,--gc-sections
          )
          EOF

          # Replace SOURCE_PATH placeholder with actual value
          sed -i "s|\$SOURCE_PATH|$SOURCE_PATH|g" CMakeLists.txt

      - name: Configure ARM64
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel 2

      - name: Prepare artifact
        run: |
          mkdir -p output/arm64-v8a

          find build -name "libFPSUnlocker.so" -exec \
            cp {} output/arm64-v8a/libFPSUnlocker.so \;

          ls -lh output/arm64-v8a/

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Unlocker-arm64-v8a
          path: output/
